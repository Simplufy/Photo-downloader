# Photo Downloader Configuration
# ================================

# Base directory for downloaded images
download_dir: "./downloads"

# Number of images to download per year/make/model combination
images_per_combination: 20

# Minimum image dimensions (pixels) - skip smaller images
min_width: 800
min_height: 600

# Maximum concurrent downloads
max_concurrent: 3

# Delay between requests (seconds) - be respectful to servers
request_delay: 1.5

# Request timeout (seconds)
request_timeout: 30

# User agent for requests
user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# Retry settings
max_retries: 3
retry_delay: 2

# Whether to use Selenium for JavaScript-heavy sites
use_selenium: false

# Sources to scrape (in priority order)
sources:
  - name: netcarshow
